{% extends "base.html" %}
{% block title %}Editar mantenimiento{% endblock %}
{% block content %}
<h1 class="h3 mb-4">Editar mantenimiento</h1>

<div class="card" style="max-width: 760px;">
  <div class="card-body">
    <form method="post">
      <input type="hidden" name="next" value="{{ next_url }}">
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Vehículo</label>
          <input class="form-control" value="{{ maintenance.vehicle.plate if maintenance.vehicle else '-' }}" disabled>
        </div>
        <div class="col-md-4">
          <label class="form-label">Fecha</label>
          <input type="date" name="date" class="form-control" value="{{ maintenance.date.isoformat() if maintenance.date else '' }}" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Proveedor</label>
          <input type="text" name="vendor" class="form-control" value="{{ maintenance.vendor or '' }}">
        </div>

        <div class="col-12">
          <label class="form-label">Concepto</label>
          <input type="text" name="concept" class="form-control" value="{{ maintenance.concept or '' }}" required>
        </div>

        <div class="col-md-4">
          <label class="form-label">Base (€)</label>
          <input type="number" name="subtotal_amount" class="form-control" step="0.01" min="0" value="{{ maintenance.subtotal_amount if maintenance.subtotal_amount is not none else '' }}">
        </div>
        <div class="col-md-4">
          <label class="form-label">IVA (€)</label>
          <input type="number" name="tax_amount" class="form-control" step="0.01" min="0" value="{{ maintenance.tax_amount if maintenance.tax_amount is not none else '' }}">
        </div>
        <div class="col-md-4">
          <label class="form-label">Total (€)</label>
          <input type="number" name="total_amount" class="form-control" step="0.01" min="0" value="{{ maintenance.total_amount if maintenance.total_amount is not none else '' }}" required>
        </div>
      </div>

      <div class="mt-4 d-flex gap-2">
        <button type="submit" class="btn btn-primary">Guardar cambios</button>
        <a href="{{ next_url }}" class="btn btn-secondary">Volver</a>
        {% if doc %}
        <a href="{{ url_for('web.document_detail', did=doc.id) }}" class="btn btn-outline-secondary">Abrir documento</a>
        {% endif %}
      </div>
    </form>
  </div>
</div>
{% endblock %}
